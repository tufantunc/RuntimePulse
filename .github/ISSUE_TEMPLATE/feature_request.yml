name: Feature request
description: Propose a concrete feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, prefer [Discussions](https://github.com/tufantunc/RuntimePulse/discussions).
        Before proposing structural changes, please read `docs/PROJECT.md` and
        `docs/superpowers/specs/`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What's the use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
